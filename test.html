<!doctype html>
<html lang="lt"><head><meta charset="utf-8"><title>XXL Fix — testai</title>
<style>
body{background:#0f1115;color:#e6e9ef;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;padding:24px}
h1{font-size:17px;margin:0 0 4px}
#sum{margin:14px 0 18px;padding:12px 16px;border-radius:10px;font-size:15px;font-weight:700}
.pass{background:rgba(61,220,132,.14);color:#3ddc84}
.fail{background:rgba(255,92,92,.14);color:#ff5c5c}
.t{padding:3px 0;border-bottom:1px solid #1e222b}
.t.ok::before{content:"PASS  ";color:#3ddc84}
.t.no::before{content:"FAIL  ";color:#ff5c5c}
.t .d{color:#98a2b3;padding-left:6em;white-space:pre-wrap}
h2{font-size:13px;color:#4da3ff;margin:20px 0 6px;text-transform:uppercase;letter-spacing:.8px}
</style></head>
<body>
<h1>XXL Ašių taisyklė — testai</h1>
<div id="sum">vykdoma…</div>
<div id="out"></div>

<script>
var P = 0, F = 0, out;
function section(t){ var h=document.createElement("h2"); h.textContent=t; document.getElementById("out").appendChild(h); }
function ck(name, cond, detail){
  var d=document.createElement("div"); d.className="t "+(cond?"ok":"no");
  d.innerHTML='<span>'+name+'</span>'+(detail&&!cond?'<div class="d">'+String(detail).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];})+'</div>':'');
  document.getElementById("out").appendChild(d);
  cond ? P++ : F++;
}
function near(a,b,eps){ return Math.abs(a-b) <= (eps===undefined?1e-6:eps); }

// physical machine-plane point of every hole, sorted — the geometry fingerprint
function fingerprint(doc){
  return doc.holes.map(function(h){
    return [h.face===1||h.face===6?"T":"E", h.x.toFixed(4), h.y.toFixed(4), (h.z||0).toFixed(4), h.d].join("|");
  }).sort();
}
function rotPts(doc, ccw){
  return doc.holes.map(function(h){
    var nx = ccw ? doc.DY - h.y : h.y;
    var ny = ccw ? h.x : doc.DX - h.x;
    return [h.face===1||h.face===6?"T":"E", nx.toFixed(4), ny.toFixed(4), (h.z||0).toFixed(4), h.d].join("|");
  }).sort();
}

async function run(){
  // load the core straight out of index.html so tests exercise shipped code
  var html = await (await fetch("index.html")).text();
  var core = /<script id="xxl-core">([\s\S]*?)<\/script>/.exec(html);
  if(!core){ document.getElementById("sum").className="fail"; document.getElementById("sum").textContent="Nerastas xxl-core!"; return; }
  (0,eval)(core[1]);
  var v3 = /<script id="v3d-core">([\s\S]*?)<\/script>/.exec(html);
  if (v3) (0,eval)(v3[1]);

  var fx = {};
  for (var n of ["swood_portrait","maestro_edges","maestro_routing","maestro_arcs","swood_edges","step2xxl_led"])
    fx[n] = await (await fetch("fixtures/"+n+".xxl")).text();

  /* ---------------- parsing ---------------- */
  section("Skaitymas / parsing");
  var sw = XXL.parse(fx.swood_portrait);
  ck("SWOOD: DX=684 DY=2200 DZ=18", sw.DX===684 && sw.DY===2200 && sw.DZ===18, sw.DX+" x "+sw.DY+" x "+sw.DZ);
  ck("SWOOD: atpažintas dialektas", sw.dialect==="swood", sw.dialect);
  ck("SWOOD: 24 gręžimai", sw.holes.length===24, sw.holes.length);
  ck("SWOOD: visi F=1", Object.keys(sw.faceUse).join()==="1", JSON.stringify(sw.faceUse));
  ck("SWOOD: be klaidų", sw.errors.length===0, sw.errors.join("; "));

  var me = XXL.parse(fx.maestro_edges);
  ck("Maestro: DX=888 DY=600", me.DX===888 && me.DY===600, me.DX+" x "+me.DY);
  ck("Maestro: dialektas maestro", me.dialect==="maestro", me.dialect);
  ck("Maestro: 6 briaunų gręžimai", me.holes.length===6, me.holes.length);
  ck("Maestro: F2 kairė (X=0)", me.holes.filter(function(h){return h.face===2;}).every(function(h){return h.x===0;}), JSON.stringify(me.holes.filter(function(h){return h.face===2;}).map(function(h){return [h.x,h.y];})));
  ck("Maestro: F3 dešinė (X=DX)", me.holes.filter(function(h){return h.face===3;}).every(function(h){return h.x===888;}), JSON.stringify(me.holes.filter(function(h){return h.face===3;}).map(function(h){return [h.x,h.y];})));
  ck("Maestro: F2/F3 Y = 50/300/550", JSON.stringify(me.holes.map(function(h){return h.y;}).sort(function(a,b){return a-b;}))==="[50,50,300,300,550,550]",
     JSON.stringify(me.holes.map(function(h){return h.y;})));

  var mr = XXL.parse(fx.maestro_routing);
  ck("Maestro: frezavimo kelias rastas", mr.paths.length===1 && mr.paths[0].pts.length===7, mr.paths.length+" kelias, "+(mr.paths[0]||{pts:[]}).pts.length+" tšk.");
  var ma = XXL.parse(fx.maestro_arcs);
  ck("Maestro: lankai (XA2P) suskaityti", ma.paths.length>0, ma.paths.length);

  /* ---------------- plane origin / SWOOD edge holes ---------------- */
  section("Briaunų gręžiniai be ChangePlane (SWOOD)");
  var se = XXL.parse(fx.swood_edges);            // 964 x 425 x 18, F2 + F3, be ChangePlane
  ck("SWOOD briaunos: 964×425, 6 gręžiniai", se.DX===964 && se.DY===425 && se.holes.length===6,
     se.DX+"x"+se.DY+" holes="+se.holes.length);
  ck("Faile nėra ChangePlane", se.hasPlanes===false, se.hasPlanes);
  ck("F3 teigiamos reikšmės nelaikomos Maestro atskaita", (function(){
      var r = se.holes.filter(function(h){return h.face===3;});
      return r.length===3 && r.every(function(h){return h.x===964;}) &&
             JSON.stringify(r.map(function(h){return h.y;}))==="[50,212.5,375]"; })(),
     JSON.stringify(se.holes.filter(function(h){return h.face===3;}).map(function(h){return [h.x,h.y];})));
  ck("F2 kairėje briaunoje", (function(){
      var l = se.holes.filter(function(h){return h.face===2;});
      return l.length===3 && l.every(function(h){return h.x===0;}) &&
             JSON.stringify(l.map(function(h){return h.y;}))==="[50,212.5,375]"; })(),
     JSON.stringify(se.holes.filter(function(h){return h.face===2;}).map(function(h){return [h.x,h.y];})));
  ck("Visi gręžiniai plokštės ribose",
     se.holes.every(function(h){return h.x>=0&&h.x<=se.DX&&h.y>=0&&h.y<=se.DY;}),
     JSON.stringify(se.holes.map(function(h){return [h.x,h.y];})));
  ck("Storio koordinatė 9 (18/2)", se.holes.every(function(h){return h.t===9;}),
     JSON.stringify(se.holes.map(function(h){return h.t;})));
  ck("Maestro neigiamos F3 reikšmės vis dar teisingos", (function(){
      var r = me.holes.filter(function(h){return h.face===3;});
      return r.every(function(h){return h.x===888 && h.y>=0 && h.y<=600;}); })(),
     JSON.stringify(me.holes.filter(function(h){return h.face===3;}).map(function(h){return [h.x,h.y];})));

  [true,false].forEach(function(ccw){
    var rr = XXL.rotate(fx.swood_edges, ccw), rd = XXL.parse(rr.text);
    var tag = "SWOOD briaunos "+(ccw?"CCW":"CW");
    ck(tag+": matmenys 425×964", rd.DX===425 && rd.DY===964, rd.DX+"x"+rd.DY);
    ck(tag+": gręžiniai lieka ribose",
       rd.holes.every(function(h){return h.x>=-0.01&&h.x<=rd.DX+0.01&&h.y>=-0.01&&h.y<=rd.DY+0.01;}),
       JSON.stringify(rd.holes.map(function(h){return [h.x,h.y];})));
    ck(tag+": pasukta padėtis teisinga", (function(){
        var want = se.holes.map(function(h){
          return (ccw ? [se.DY-h.y, h.x] : [h.y, se.DX-h.x]).map(function(v){return v.toFixed(3);}).join(","); }).sort();
        var got = rd.holes.map(function(h){return [h.x.toFixed(3),h.y.toFixed(3)].join(",");}).sort();
        return JSON.stringify(want)===JSON.stringify(got); })(),
       JSON.stringify(rd.holes.map(function(h){return [h.x,h.y];})));
    ck(tag+": rezultate irgi nėra ChangePlane", XXL.parse(rr.text).hasPlanes===false);
    ck(tag+": storio koordinatė nepakito", rd.holes.every(function(h){return h.t===9;}),
       JSON.stringify(rd.holes.map(function(h){return h.t;})));
  });
  ck("SWOOD briaunos: CCW→CW grąžina originalą", (function(){
      var b = XXL.parse(XXL.rotate(XXL.rotate(fx.swood_edges,true).text,false).text);
      return b.DX===se.DX && b.DY===se.DY &&
             JSON.stringify(b.holes.map(function(h){return [h.face,h.x,h.y,h.t];}))===
             JSON.stringify(se.holes.map(function(h){return [h.face,h.x,h.y,h.t];})); })());

  /* ---------------- rotation geometry ---------------- */
  section("Geometrija po pasukimo");
  [["swood_portrait",true],["swood_portrait",false],["maestro_edges",true],["maestro_edges",false],
   ["maestro_routing",true],["maestro_routing",false],["maestro_arcs",true],["maestro_arcs",false]].forEach(function(c){
    var name=c[0], ccw=c[1], tag=name+" "+(ccw?"CCW":"CW");
    var src = XXL.parse(fx[name]);
    var r = XXL.rotate(fx[name], ccw);
    var d2 = XXL.parse(r.text);
    ck(tag+": DX/DY sukeisti", d2.DX===src.DY && d2.DY===src.DX, d2.DX+" x "+d2.DY+" (laukta "+src.DY+" x "+src.DX+")");
    ck(tag+": DZ nepakito", d2.DZ===src.DZ, d2.DZ);
    ck(tag+": kiekvienas gręžimas fiziškai toje pat vietoje",
       JSON.stringify(fingerprint(d2))===JSON.stringify(rotPts(src,ccw)),
       "gauta "+JSON.stringify(fingerprint(d2)).slice(0,300)+"\nlaukta "+JSON.stringify(rotPts(src,ccw)).slice(0,300));
    ck(tag+": gręžimų skaičius nepakito", d2.holes.length===src.holes.length, d2.holes.length+" vs "+src.holes.length);
    var inside = d2.holes.every(function(h){ return h.x>=-0.001 && h.x<=d2.DX+0.001 && h.y>=-0.001 && h.y<=d2.DY+0.001; });
    ck(tag+": visi gręžimai plokštės ribose", inside,
       JSON.stringify(d2.holes.filter(function(h){return h.x<0||h.x>d2.DX||h.y<0||h.y>d2.DY;}).map(function(h){return [h.face,h.x,h.y];})));
    // routing paths
    var pSrc=[], pDst=[];
    src.paths.forEach(function(p){ p.pts.forEach(function(q){ if(isFinite(q[0])&&isFinite(q[1]))
      pSrc.push((ccw?src.DY-q[1]:q[1]).toFixed(4)+","+(ccw?q[0]:src.DX-q[0]).toFixed(4)); }); });
    d2.paths.forEach(function(p){ p.pts.forEach(function(q){ if(isFinite(q[0])&&isFinite(q[1]))
      pDst.push(q[0].toFixed(4)+","+q[1].toFixed(4)); }); });
    ck(tag+": frezavimo taškai pasukti teisingai", JSON.stringify(pSrc)===JSON.stringify(pDst),
       "gauta "+JSON.stringify(pDst).slice(0,220)+"\nlaukta "+JSON.stringify(pSrc).slice(0,220));
  });

  /* ---------------- round trip ---------------- */
  section("Grįžtamumas / round-trip");
  ["swood_portrait","maestro_edges","maestro_routing","maestro_arcs"].forEach(function(n){
    var a = XXL.rotate(fx[n], true).text;
    var b = XXL.rotate(a, false).text;          // CCW then CW == identity
    var o = XXL.parse(fx[n]), z = XXL.parse(b);
    ck(n+": CCW→CW grąžina matmenis", o.DX===z.DX && o.DY===z.DY, z.DX+" x "+z.DY);
    ck(n+": CCW→CW grąžina geometriją", JSON.stringify(fingerprint(o))===JSON.stringify(fingerprint(z)),
       JSON.stringify(fingerprint(z)).slice(0,300));
    ck(n+": CCW→CW grąžina plokštumas", JSON.stringify(o.faceUse)===JSON.stringify(z.faceUse),
       JSON.stringify(z.faceUse)+" vs "+JSON.stringify(o.faceUse));
  });
  ["swood_portrait","maestro_edges"].forEach(function(n){
    var t = fx[n];
    for (var i=0;i<4;i++) t = XXL.rotate(t, true).text;     // 4x90 = 360
    var o = XXL.parse(fx[n]), z = XXL.parse(t);
    ck(n+": 4×CCW = pilnas apsukimas", o.DX===z.DX && o.DY===z.DY &&
       JSON.stringify(fingerprint(o))===JSON.stringify(fingerprint(z)), z.DX+" x "+z.DY);
  });

  /* ---------------- face mapping ---------------- */
  section("Plokštumų perskaičiavimas");
  var mapCCW = {2:4,3:5,4:3,5:2}, mapCW = {2:5,3:4,4:2,5:3};
  Object.keys(mapCCW).forEach(function(f){
    ck("CCW: F"+f+" → F"+mapCCW[f], XXL._.rotFace(+f,true)===mapCCW[f], XXL._.rotFace(+f,true));
    ck("CW:  F"+f+" → F"+mapCW[f],  XXL._.rotFace(+f,false)===mapCW[f], XXL._.rotFace(+f,false));
  });
  ck("F1 ir F6 nekinta", XXL._.rotFace(1,true)===1 && XXL._.rotFace(6,true)===6 && XXL._.rotFace(1,false)===1);
  var edg = XXL.rotate(fx.maestro_edges, true);
  var ed2 = XXL.parse(edg.text);
  ck("Briaunų plokštumos perrašytos F2/F3 → F4/F5", JSON.stringify(Object.keys(ed2.faceUse).sort())==='["4","5"]', JSON.stringify(ed2.faceUse));
  ck("O ;ChangePlane eilutės atnaujintos", !/O\s+Y=600/.test(edg.text) && /F=4|F=5/.test(edg.text),
     (edg.text.match(/^O .*$/gm)||[]).slice(0,4).join(" | "));

  /* ---------------- byte-level fidelity ---------------- */
  section("Formato išsaugojimas");
  var sr = XXL.rotate(fx.swood_portrait, true);
  var sl = fx.swood_portrait.split(/\r?\n/), rl = sr.text.split(/\r?\n/);
  ck("Eilučių skaičius +1 (antspaudas)", rl.length===sl.length+1, rl.length+" vs "+sl.length);
  ck("CRLF išsaugota", /\r\n/.test(sr.text), JSON.stringify(sr.text.slice(0,90)));
  ck("Komentarai nepaliesti", rl.filter(function(l){return /^;Fichier/.test(l);}).length===1 &&
     sr.text.indexOf(";Fichier : DESINE_SPORTO_RUBINE_LENKTAS_1OP")>=0);
  ck("Užbaigiantis '#' išsaugotas", (sr.text.match(/#\s*$/gm)||[]).length===24, (sr.text.match(/#\s*$/gm)||[]).length);
  ck("N=\"L\" D=8 nepaliesti", (sr.text.match(/D=8 N="L"/g)||[]).length===24, (sr.text.match(/D=8 N="L"/g)||[]).length);
  ck("Z gylis nepakito", (sr.text.match(/Z=-24\.559/g)||[]).length===24, (sr.text.match(/Z=-24\.559/g)||[]).length);
  ck("Antraštė: DX=2200 DY=684", /H DX=2200 DY=684 DZ=18/.test(sr.text), rl[0]);
  ck("BZ=21 nepakito", /BZ=21/.test(sr.text), rl[0]);
  ck("Antspaudas įterptas po antraštės", /^;\*\*\* XXL Fix: pasukta 90 CCW/.test(rl[1]), rl[1]);
  ck(".END išlikęs", /^\.END/m.test(sr.text));
  ck("Desimalės išsaugotos (88.248485 → Y)", /Y=88\.248485/.test(sr.text),
     (sr.text.match(/XBO [^\n]*/)||[""])[0]);
  ck("Sveikieji lieka sveikais (nėra 2191.000000)", !/=\d+\.000000/.test(sr.text),
     (sr.text.match(/=\d+\.000000/g)||[]).slice(0,3).join());

  var mrr = XXL.rotate(fx.maestro_routing, true).text;
  ck("Maestro 3 dešimtainiai išlaikyti", /X=\d+\.\d{3}\b/.test(mrr), (mrr.match(/XBO [^\n]*/)||[""])[0]);
  ck("XG0 įrankio parametrai nepaliesti", /T=96 P=0 D=20 C=0 V=4000 S=18000 s=0/.test(mrr));
  var mar = XXL.rotate(fx.maestro_arcs, true).text;
  ck("Lanko kryptis G=3 nepakito", (mar.match(/G=3/g)||[]).length===(fx.maestro_arcs.match(/G=3/g)||[]).length,
     (mar.match(/XA2P [^\n]*/)||[""])[0]);
  ck("Lanko centras I/J pasuktas", /I=\d/.test(mar) && /J=\d/.test(mar), (mar.match(/XA2P [^\n]*/)||[""])[0]);

  /* ---------------- arc radius invariance ---------------- */
  section("Lankų teisingumas");
  (function(){
    var src = fx.maestro_arcs, rot = XXL.rotate(src, true).text;
    function arcs(t){
      var o=[], m, re=/^XA2P .*$/gm;
      var lines = t.split(/\r?\n/); var prev=null;
      lines.forEach(function(l){
        var p = XXL._.params(XXL._.splitComment(l)[0]);
        if(/^\s*(XL2P|XG0)/.test(l) && p.X!==undefined) prev=[parseFloat(p.X),parseFloat(p.Y)];
        if(/^\s*XA2P/.test(l) && p.I!==undefined && prev){
          var r1=Math.hypot(prev[0]-parseFloat(p.I), prev[1]-parseFloat(p.J));
          var r2=Math.hypot(parseFloat(p.X)-parseFloat(p.I), parseFloat(p.Y)-parseFloat(p.J));
          o.push([r1,r2]); prev=[parseFloat(p.X),parseFloat(p.Y)];
        }
      });
      return o;
    }
    var a1=arcs(src), a2=arcs(rot);
    ck("Lankų rasta abiejuose", a1.length>0 && a1.length===a2.length, a1.length+" vs "+a2.length);
    ck("Spinduliai sutampa pradžioje ir gale (originalas)", a1.every(function(p){return near(p[0],p[1],1e-6);}), JSON.stringify(a1));
    ck("Spinduliai nepakito po pasukimo",
       a1.every(function(p,i){ return a2[i] && near(p[0],a2[i][0],1e-6) && near(p[1],a2[i][1],1e-6); }),
       JSON.stringify(a1)+" vs "+JSON.stringify(a2));
  })();

  /* ---------------- thickness ---------------- */
  section("Medžiagos storio keitimas");

  // side-hole thickness coordinate: 9 in 18mm -> 8 in 16mm
  var th = XXL.setThickness(fx.maestro_edges, 16);
  var thd = XXL.parse(th.text);
  ck("DZ antraštėje 18 → 16", thd.DZ===16, thd.DZ);
  ck("DX/DY nepakito", thd.DX===888 && thd.DY===600, thd.DX+"x"+thd.DY);
  ck("Centruoti briaunų gręžiniai 9 → 8", thd.holes.every(function(h){return h.t===8;}),
     JSON.stringify(thd.holes.map(function(h){return h.t;})));
  ck("Briaunų gręžinių padėtis plokštėje nepakito",
     JSON.stringify(thd.holes.map(function(h){return [h.x,h.y];}))===JSON.stringify(me.holes.map(function(h){return [h.x,h.y];})),
     JSON.stringify(thd.holes.map(function(h){return [h.x,h.y];})));
  ck("Briaunos gręžimo gylis Z=-32 nepakito", (th.text.match(/Z=-32\.000/g)||[]).length===6,
     (th.text.match(/Z=-32[^\s]*/g)||[]).join(","));
  ck("Formatas: 3 dešimtainiai išlaikyti (X=8.000)", /X=8\.000/.test(th.text),
     (th.text.match(/XBO [^\n]*/)||[""])[0]);
  ck("Antspaudas apie storį", /;\*\*\* XXL Fix: storis 18 -> 16 mm \*\*\*/.test(th.text), th.text.split(/\r?\n/)[1]);

  // through vs blind depths on face 1
  var thr = XXL.setThickness(fx.maestro_routing, 16);       // DZ=18, blind -12, through -23, routing -20
  ck("Kiauras gręžinys -23 → -21 (5 mm užleidimas išlaikytas)", /Z=-21\.000/.test(thr.text),
     (thr.text.match(/Z=-2[0-9.]+/g)||[]).join(","));
  ck("Aklinas gręžinys -12 nepakito", (thr.text.match(/Z=-12\.000/g)||[]).length===(fx.maestro_routing.match(/Z=-12\.000/g)||[]).length,
     (thr.text.match(/Z=-12\.000/g)||[]).length+" vs "+(fx.maestro_routing.match(/Z=-12\.000/g)||[]).length);
  ck("Kiauras frezavimas -20 → -18", (thr.text.match(/Z=-18\.000/g)||[]).length===5,
     (thr.text.match(/Z=-1[0-9.]+/g)||[]).join(","));
  ck("Pakėlimo aukštis Z=20 nepakito", (thr.text.match(/Z=20\.000/g)||[]).length===(fx.maestro_routing.match(/Z=20\.000/g)||[]).length,
     (thr.text.match(/Z=20\.000/g)||[]).length+" vs "+(fx.maestro_routing.match(/Z=20\.000/g)||[]).length);
  ck("ZFAST nepaliestas", /SET ZFAST=20\.000/.test(thr.text));

  // SWOOD file: DZ=18, Z=-24.559 (through, 6.559 overshoot)
  var sth = XXL.setThickness(fx.swood_portrait, 16);
  ck("SWOOD: Z=-24.559 → -22.559", (sth.text.match(/Z=-22\.559/g)||[]).length===24,
     (sth.text.match(/Z=-2[0-9.]+/g)||[]).slice(0,2).join(","));
  ck("SWOOD: DZ=16, BZ=21 nepaliestas", /DZ=16 /.test(sth.text) && /BZ=21/.test(sth.text), sth.text.split(/\r?\n/)[0]);
  ck("SWOOD: X/Y koordinatės nepakito", JSON.stringify(XXL.parse(sth.text).holes.map(function(h){return [h.x,h.y];}))===
     JSON.stringify(sw.holes.map(function(h){return [h.x,h.y];})));

  // policies
  function mkEdge(dz, t){ return 'H DX=400 DY=300 DZ='+dz+' -B C=0 T=0 R=1 *MM /"S" V=0\r\n.OP1 ;B\r\nREFERENCE=LOWERLEFT\r\nF=2\r\nO X=0.000 Y=0.000 Z=0.000 F=2 ;ChangePlane\r\nXBO X='+t+' Y=50.000 Z=-32.000 D=5 G=1 N="P"\r\n.END\r\n'; }
  function tOf(txt){ return XXL.parse(txt).holes[0].t; }
  ck("policy center: 9/18 → 8/16", tOf(XXL.setThickness(mkEdge("18.000","9.000"),16,{policy:"center"}).text)===8);

  ck("Antraštė kaip step2xxl", rb.ok && rb.programs[0].text.split("\r\n")[0] === fx.step2xxl_led.split(/\r?\n/)[0],
     rb.ok && rb.programs[0].text.split("\r\n")[0]);
  ck("Failo vardas <PAVADINIMAS>_1OP.XXL", rb.ok && rb.programs[0].file === "_10_1OP.XXL", rb.ok && rb.programs[0].file);
  ck("CRLF ir tik ASCII", rb.ok && /\r\n/.test(rb.programs[0].text) && /^[\x00-\x7f]*$/.test(rb.programs[0].text));
  ck("Pabaiga .END / ;FINEPROG", rb.ok && /\r\n\.END\r\n;\*+\r\n;FINEPROG\r\n$/.test(rb.programs[0].text));
  var rp = rb.ok ? XXL.parse(rb.programs[0].text) : { errors: ["-"], holes: [] };
  ck("XXL Fix perskaito: 8 gręžimai, be klaidų", rp.errors.length === 0 && rp.holes.length === 8, rp.errors.join("; ") + " / " + rp.holes.length);

  // 2. faces and the extra programs
  var sp = { name: "Šonas spintai", DX: 720, DY: 560, DZ: 18, ops: [] };
  mk(sp, "edge", { edge: "R", d: 8, depth: 27, s: 100, sr: "B" });                       // X=DX end -> F=2
  mk(sp, "edge", { edge: "B", d: 8, depth: 27, s: 100, sr: "R" });                       // long edge Ø8 in place -> F=5
  mk(sp, "edge", { edge: "F", d: 5, depth: 32, s: 50, sr: "L", n: 2, step: 300 });       // long edge Ø5 -> rotated
  mk(sp, "hole", { face: "B", d: 35, depth: 13, x: 100, xr: "L", y: 22.5, yr: "F", mx: true }); // underside -> 2OP
  mk(sp, "hole", { d: 5, depth: 2, x: 360, xr: "L", y: 280, yr: "F" });                  // mark
  var sb = PART.build(sp), pk = sb.programs.map(function (p) { return p.kind; }).join(",");
  ck("Programos: 1OP + 2OP (apversta) + 3OP (pasukta)", sb.ok && pk === "main,flip,rot", pk + " " + JSON.stringify(sb.check));
  var t1 = sb.ok ? sb.programs[0].text : "", t2 = sb.ok ? sb.programs[1].text : "", t3 = sb.ok ? sb.programs[2].text : "";
  ck("Vardai be lietuviškų raidžių", sb.ok && sb.programs[0].file === "Sonas_spintai_1OP.XXL", sb.ok && sb.programs[0].file);
  ck("Dešinys galas (X=DX) -> F=2, X=aukštis", t1.indexOf(' XBO X=9 Y=460 Z=-27 D=8 N="P" F=2 R=1#') >= 0, lines(t1, /XBO/).join("\n"));
  ck("Ilgoji briauna Ø8 vietoje -> F=5, X išilgai, Y=aukštis", t1.indexOf(' XBO X=620 Y=9 Z=-27 D=8 N="P" F=5 R=1#') >= 0);
  ck("Žymė ≤ 2 mm -> N=\"L\"", t1.indexOf(' XBO X=360 Y=280 Z=-2 D=5 N="L" F=1 R=1#') >= 0);
  ck("Apačios skylės -> 2OP, Y atspindėtas (560-22.5)", lines(t2, /XBO/).join("|") ===
     ' XBO X=100 Y=537.5 Z=-13 D=35 N="P" F=1 R=1#| XBO X=620 Y=537.5 Z=-13 D=35 N="P" F=1 R=1#', lines(t2, /XBO/).join("\n"));
  ck("2OP komentaras operatoriui", /; 2OP: panel turned over about the X axis/.test(t2));
  ck("Pasukta programa: DX=560 DY=720", /^H DX=560 DY=720 DZ=18 /.test(t3), t3.split("\r\n")[0]);
  ck("Priekis -> kairysis galas F=3, Y = 720 - x", lines(t3, /XBO/).join("|") ===
     ' XBO X=9 Y=370 Z=-32 D=5 N="P" F=3 R=1#| XBO X=9 Y=670 Z=-32 D=5 N="P" F=3 R=1#', lines(t3, /XBO/).join("\n"));
  ck("3OP komentaras: pasukti prieš laikrodžio rodyklę", /COUNTER-CLOCKWISE/.test(t3));
  ck("3D vaizdui: pasuktos skylės kairiajame gale", sb.ok && sb.programs[2].view.holes.every(function (h) { return h.face === 2 && h.x === 0; }));

  var lg = { name: "ILGA", DX: 1200, DY: 400, DZ: 18, ops: [] };
  mk(lg, "edge", { edge: "F", d: 5, depth: 32, s: 100, sr: "L" });
  var lgb = PART.check(lg);
  ck("Ø5 ilgojoje briaunoje, plokštė > 900 -> klaida", lgb.errors === 1, JSON.stringify(lgb.ops));

  // 3. routing rules (2 mm skin, ramp, never plunge, 20 mm air limit)
  var rt = { name: "R", DX: 720, DY: 560, DZ: 18, ops: [] };
  mk(rt, "groove", { dir: "X", p: 20, pr: "B", w: 16, depth: 8, full: true });
  mk(rt, "groove", { dir: "Y", p: 100, pr: "L", w: 40, depth: 10, full: false, a: 50, ar: "F", len: 200 });
  ["FL", "FR", "BL", "BR"].forEach(function (c) { mk(rt, "notch", { corner: c, a: 40, b: 30 }); });
  mk(rt, "cut", { xr: "L", x: 300, yr: "F", y: 200, w: 120, h: 80 });
  mk(rt, "circle", { xr: "L", x: 200, yr: "B", y: 120, D: 60 });
  mk(rt, "groove", { face: "B", dir: "Y", p: 30, pr: "R", w: 16, depth: 6, full: true });
  var rtb = PART.build(rt);
  ck("Frezavimai: be klaidų", rtb.ok, JSON.stringify(rtb.check));
  var mv = [], air = [], deep = [], plunge = [], ramps = 0;
  rtb.programs.forEach(function (pg) {
    var m = moves(pg.text), prev = null;
    m.forEach(function (q) {
      if (q.x < -20 - 1e-9 || q.x > pg.DX + 20 + 1e-9 || q.y < -20 - 1e-9 || q.y > pg.DY + 20 + 1e-9) air.push(q.l);
      if (q.z < -(18 - 2) - 1e-9) deep.push(q.l);
      if (prev && q.t === "L" && q.x === prev.x && q.y === prev.y && q.z < prev.z - 1e-9 && q.z < 0) plunge.push(q.l);
      if (prev && q.t === "L" && prev.z === 0 && q.z < 0 && (q.x !== prev.x || q.y !== prev.y)) ramps++;
      prev = q;
    });
    mv = mv.concat(m);
  });
  var nRoutes = rtb.programs.reduce(function (a, p) { return a + p.routes.length; }, 0);
  ck("Niekada > 20 mm už plokštės (NC17050)", air.length === 0, air.join("\n"));
  ck("Visada lieka 2 mm (Z ≥ -16)", deep.length === 0, deep.join("\n"));
  ck("Niekada nesminga vertikaliai į medžiagą", plunge.length === 0, plunge.join("\n"));
  ck("Kiekvienas frezavimas įeina nuožulniai", ramps === nRoutes, ramps + " / " + nRoutes);
  ck("Kiaurymė: 4 lankai G=3 aplink centrą", lines(rtb.programs[0].text, / XA2P .* I=200 J=440 G=3 /).length === 4);
  ck("Apačios griovelis -> 2OP", rtb.programs.length === 2 && rtb.programs[1].routes.length === 1);
  ck("Kampų išpjovos: medžiaga dešinėje (frezuoja atliekų pusėje)", (function () {
    // every notch path stays inside its notch rectangle grown by the lead-in, i.e. in the waste
    return rt.ops.filter(function (o) { return o.kind === "notch"; }).every(function (o, k) {
      var r = PART.notchRect(o, rt), rtx = rtb.programs[0].routes.filter(function (q) { return q.name === "NOTCH"; })[k];
      return rtx.moves.every(function (q) {
        return q.x >= r.x0 - PART.LEAD - 1e-6 && q.x <= r.x1 - PART.R + 1e-6 + (r.x0 > 0 ? PART.LEAD + PART.R : 0) &&
               q.y >= r.y0 - PART.LEAD - 1e-6 && q.y <= r.y1 + PART.LEAD + 1e-6;
      });
    });
  })());
  var rp2 = XXL.parse(rtb.programs[0].text);
  ck("XXL Fix perskaito frezavimus", rp2.errors.length === 0 && rp2.paths.length === rtb.programs[0].routes.length, rp2.paths.length);
  ck("Nė vienas frezavimas nepažymėtas kaip LED", rp2.paths.every(function (p) { return !p.led; }));

  // 4. checks a worker will hit
  function errs(P) { return PART.check(P).errors; }
  var e1 = { name: "E", DX: 600, DY: 400, DZ: 18, ops: [] };
  mk(e1, "hole", { d: 6 });                                         ck("Ø6 grąžto nėra -> klaida", errs(e1) === 1);
  e1.ops = []; mk(e1, "hole", { d: 15, through: true });             ck("Ø15 kiaurai -> klaida", errs(e1) === 1);
  e1.ops = []; mk(e1, "hole", { d: 8, depth: 18 });                  ck("Gylis = storis be „Kiaurai“ -> klaida", errs(e1) === 1);
  e1.ops = []; mk(e1, "hole", { x: 650 });                           ck("Skylė už ribų -> klaida", errs(e1) === 1);
  e1.ops = []; mk(e1, "edge", { edge: "L", d: 8, depth: 40 });       ck("Briaunos gylis > 35 -> klaida", errs(e1) === 1);
  e1.ops = []; mk(e1, "groove", { w: 10 });                          ck("Griovelis siauresnis už frezą -> klaida", errs(e1) === 1);
  e1.ops = []; mk(e1, "groove", { depth: 17 });                      ck("Griovelis giliau nei storis-2 -> klaida", errs(e1) === 1);
  e1.ops = []; mk(e1, "circle", { D: 12 });                          ck("Kiaurymė < Ø20 -> klaida", errs(e1) === 1);
  e1.ops = []; mk(e1, "cut", { xr: "L", x: 0 });                     ck("Išpjova liečia kraštą -> klaida", errs(e1) === 1);
  var e2 = { name: "E", DX: 400, DY: 1000, DZ: 18, ops: [] };
  ck("Per plati (Y > 900) -> klaida", errs(e2) === 1);
  var e3 = { name: "", DX: 600, DY: 400, DZ: 18, ops: [] };
  ck("Be pavadinimo -> klaida", errs(e3) === 1);
  e1.ops = []; mk(e1, "shelf"); mk(e1, "hinge"); mk(e1, "edge"); mk(e1, "groove"); mk(e1, "notch"); mk(e1, "cut"); mk(e1, "circle"); mk(e1, "hole");
  ck("Visos naujos operacijos iškart teisingos", errs(e1) === 0, JSON.stringify(PART.check(e1).ops));

  // 5. measured from an edge -> stays put when the panel grows
  var g1 = { name: "G", DX: 600, DY: 400, DZ: 18, ops: [] };
  mk(g1, "hole", { x: 37, xr: "R", y: 50, yr: "B" });
  g1.DX = 800; g1.DY = 500;
  var hp = PART.holePts(g1.ops[0], g1)[0];
  ck("Skylė lieka 37 nuo dešinės / 50 nuo galo pakeitus dydį", hp.x === 763 && hp.y === 450, hp.x + "," + hp.y);
  var c2 = { name: "C", DX: 600, DY: 400, DZ: 18, ops: [] };
  mk(c2, "hole", { x: 0, xr: "C", n: 3, step: 32, dir: "X" });
  ck("Centruota eilė lieka centre", PART.holePts(c2.ops[0], c2).map(function (p) { return p.x; }).join() === "268,300,332");

  // 6. turning the whole part 90° four times changes nothing
  var q = rt; for (var qi = 0; qi < 4; qi++) q = PART.rotate(q);
  ck("Pasukus 4×90° — tos pačios programos", JSON.stringify(PART.build(q).programs.map(function (p) { return p.text; })) ===
     JSON.stringify(rtb.programs.map(function (p) { return p.text; })));
  var r1x = PART.rotate(sp), r1b = PART.build(r1x);
  ck("Pasukus 90°: tos pačios skylės (tik kitoje padėtyje)", r1b.ok &&
     r1b.programs.reduce(function (a, p) { return a + p.bores.length; }, 0) === sb.programs.reduce(function (a, p) { return a + p.bores.length; }, 0),
     JSON.stringify(r1b.check));

  /* ---------------- part builder UI ---------------- */
  section("Nauja detalė — langas");
  await (async function () {
    var fr = document.createElement("iframe");
    fr.style.cssText = "width:1280px;height:1024px;border:1px solid #2b313d;border-radius:8px;margin:8px 0";
    fr.src = "index.html";
    document.getElementById("out").appendChild(fr);
    await new Promise(function (res) { fr.onload = res; });
    var w = fr.contentWindow, doc = fr.contentDocument, errs2 = [];
    w.addEventListener("error", function (e) { errs2.push(e.message); });
    try { w.localStorage.removeItem("xxlfix.builder.draft.v1"); } catch (e) {}
    await new Promise(function (r) { setTimeout(r, 300); });
    var ob = doc.getElementById("pbOpen");
    ck("Mygtukas „Nauja detalė“ antraštėje", !!ob);
    ob.click();
    await new Promise(function (r) { setTimeout(r, 200); });
    ck("Langas atsidaro", !doc.getElementById("pb").hidden);
    ck("8 operacijų mygtukai", doc.querySelectorAll("#pbTiles [data-add]").length === 8);
    w.PB.set({ v: 1, name: "TEST", DX: 720, DY: 560, DZ: 18, ops: [] });
    Array.prototype.forEach.call(doc.querySelectorAll("#pbTiles [data-add]"), function (b) { b.click(); });
    await new Promise(function (r) { setTimeout(r, 200); });
    ck("Visos 8 operacijos pridėtos", w.PB.get().ops.length === 8, w.PB.get().ops.length);
    ck("Brėžinyje matosi operacijos", doc.querySelectorAll("#pbSvg g.op").length >= 8, doc.querySelectorAll("#pbSvg g.op").length);
    var b = w.PB.built();
    ck("Paruošta be klaidų", b && b.ok && b.programs.length >= 1, b && JSON.stringify(b.check));
    ck("Programų kortelė apačioje", doc.querySelectorAll("#pbProgs .pb-prog").length === (b ? b.programs.length : -1));
    ck("Pasirinkta paskutinė operacija rodo nustatymus", !!doc.querySelector("#pbRight .pb-ph"));
    // type a bad value: status turns red, button disabled
    var o = w.PB.get().ops[0]; w.PB.select(o.id);
    var inp = doc.querySelector('#pbRight .pb-num[data-k="depth"] input');
    inp.value = "25"; inp.dispatchEvent(new Event("input", { bubbles: true }));
    ck("Klaidingas gylis -> „pataisykite“ ir atsisiuntimas išjungtas",
       /pataisykite/.test(doc.getElementById("pbStatus").textContent) && doc.getElementById("pbDl").disabled);
    inp.value = "12,5"; inp.dispatchEvent(new Event("input", { bubbles: true }));
    ck("Kablelis priimamas (12,5)", w.PB.get().ops[0].depth === 12.5, w.PB.get().ops[0].depth);
    ck("Telpa į 1280×1024 be slinkimo", doc.getElementById("pb").scrollHeight <= 1024 && doc.getElementById("pb").scrollWidth <= 1280,
       doc.getElementById("pb").scrollWidth + "×" + doc.getElementById("pb").scrollHeight);
    doc.getElementById("pbClose").click();
    ck("Uždaromas", doc.getElementById("pb").hidden);
    ck("Klaidų nebuvo", errs2.length === 0, JSON.stringify(errs2));
    fr.remove();
  })();

  /* ---------------- summary ---------------- */
  var s=document.getElementById("sum");
  s.className = F? "fail":"pass";
  s.textContent = (F? "✗ ":"✓ ") + P + " praėjo, " + F + " nepavyko  (iš viso " + (P+F) + ")";
  window.__RESULT__ = {pass:P, fail:F};
}
run().catch(function(e){
  var s=document.getElementById("sum"); s.className="fail"; s.textContent="Klaida: "+e.message;
  window.__RESULT__={pass:P,fail:F,error:String(e&&e.stack||e)};
});
</script>
</body></html>
